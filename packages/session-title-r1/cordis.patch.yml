# dsh bundle patch for @deepseek-ai/dsh-plugin-api-session-title.
# R3 boundary: we replace the `ctx.sessionTitle` service/event face ONLY; the
# `@deepseek-ai/dsh-session-title` import face (including ./invariant and ./types
# subpaths) stays official (see requirements 3.6 and docs/capability-strategy.md R3).
# The insert config mirrors the official dsh-base defaults (5/40/80) so this
# bundle can activate standalone when the official row is absent (design D6).
- id: session-title
  disabled: true
- insert:
    - id: session-title-r1
      name: '@deepseek-ai/dsh-plugin-api-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80
