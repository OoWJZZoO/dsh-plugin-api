# Full aggregate bundle patch for @deepseek-ai/dsh-plugin-api-full.
# Deterministic assembly order:
#   1. main facade row (must precede any third-party plugin row);
#   2. compaction replacement: disable the official row, insert ours;
#   3. session-title replacement: disable the official row, insert ours;
#   4. mcp replacement: disable the official loader row, insert ours;
#   5. attachment replacement: disable the official loader row, insert ours;
#   6. agent-loop replacement: disable the official loader row, insert ours;
#   7. session-branch replacement: disable the official session row, insert ours;
#   8. tool-skill replacement: disable the official skill loader row, insert ours;
#   9. llm replacement: disable the official llm row, insert ours;
#   10. connection replacement: disable the official connection row, insert ours;
#   11. typert-gateway replacement: disable the official gateway row, insert ours.
# The bundle adds no API of its own: third-party plugins keep using
# ctx.pluginApi from @deepseek-ai/dsh-plugin-api-main.
- insert:
    - id: plugin-api-main
      name: '@deepseek-ai/dsh-plugin-api-main'
      config: {}
- id: compaction-basic
  disabled: true
- insert:
    - id: plugin-api-compaction-events
      name: '@deepseek-ai/dsh-plugin-api-compaction-events'
      config: {}
- id: session-title
  disabled: true
- insert:
    - id: plugin-api-session-title
      name: '@deepseek-ai/dsh-plugin-api-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80
- id: mcp-client
  disabled: true
- insert:
    - id: plugin-api-mcp
      name: '@deepseek-ai/dsh-plugin-api-mcp'
      config: {}
- id: attachment-local
  disabled: true
- insert:
    - id: plugin-api-attachments
      name: '@deepseek-ai/dsh-plugin-api-attachments'
      config: {}
- id: agent-loop
  disabled: true
- insert:
    - id: plugin-api-agent-loop
      name: '@deepseek-ai/dsh-plugin-api-agent-loop'
      config:
        maxParallelToolCalls: 10
        agents: []
- id: session
  disabled: true
- insert:
    - id: plugin-api-session-branch
      name: '@deepseek-ai/dsh-plugin-api-session-branch'
- id: tool-skill
  disabled: true
- insert:
    - id: plugin-api-tool-skill
      name: '@deepseek-ai/dsh-plugin-api-tool-skill'
- id: llm
  disabled: true
- insert:
    - id: plugin-api-llm
      name: '@deepseek-ai/dsh-plugin-api-llm'
- id: connection
  disabled: true
- insert:
    - id: plugin-api-session-channel-connection
      name: '@deepseek-ai/dsh-plugin-api-session-channel-connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts
- id: typert-gateway
  disabled: true
- insert:
    - id: plugin-api-session-channel-gateway
      name: '@deepseek-ai/dsh-plugin-api-session-channel-gateway'

#   12. workspace replacement: disable the official workspace row, insert ours;
#   13. api-remotes replacement: disable the official browser-roster row, insert ours;
#   14. client-runtime replacement: disable the official browser-roster row, insert ours.
- id: workspace
  disabled: true
- insert:
    - id: plugin-api-workspace
      name: '@deepseek-ai/dsh-plugin-api-workspace'
- id: api-remotes
  disabled: true
- insert:
    - id: plugin-api-api-remotes
      name: '@deepseek-ai/dsh-plugin-api-api-remotes'
      inject: [loader]
- id: client-runtime
  disabled: true
- insert:
    - id: plugin-api-client-runtime
      name: '@deepseek-ai/dsh-plugin-api-client-runtime'
      inject: [loader]
